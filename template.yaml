AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Resources:
  TRF4CloudflareCookiesManager:
    Type: 'AWS::DynamoDB::Table'
    Properties:
      TableName: 'TRF4CloudflareCookiesManager'
      AttributeDefinitions:
        - AttributeName: 'PHPSESSID'
          AttributeType: 'S'
        # - AttributeName: 'cookie'
        #   AttributeType: 'S'
      KeySchema:
        - AttributeName: 'PHPSESSID'
          KeyType: 'HASH'
        # - AttributeName: 'cookie'
        #   KeyType: 'RANGE'
      BillingMode: "PAY_PER_REQUEST" # Cobrança sob demanda (recomendado)

  MyApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: MyApi
      StageName: Prod

  HelloWorldFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      Architectures:
        # - arm64
        - x86_64
      ImageUri: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/hello-world"
      Policies:
        - Statement:
          - Effect: Allow
            Action:
              - dynamodb:PutItem
              - dynamodb:GetItem
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
              - dynamodb:Query
              - dynamodb:Scan
            Resource: !GetAtt TRF4CloudflareCookiesManager.Arn
      Events:
        HelloWorld:
          Type: Api
          Properties:
            Path: /hello
            Method: post
            RestApiId: !Ref MyApi
        # UpdateCookiesEvent:
        #   Type: Schedule
        #   Properties:
        #     Schedule: "cron(0 5,12 * * ? *)"
        #     Name: UpdateCookiesEvent
        #     Description: "Trigger to update cookies every day at 5 AM and 2 PM"
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: ./hello_world
      DockerTag: python3.12-v1

Outputs:
  HelloWorldApi:
    Description: "API Gateway endpoint URL for Prod stage"
    Value: !Sub "https://${MyApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/hello/"
  HelloWorldFunction:
    Description: "Hello World Lambda Function ARN"
    Value: !GetAtt HelloWorldFunction.Arn
